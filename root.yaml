apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: app-of-apps
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
  project: default
  sources:
  - repoURL: git@github.com:iagouvea07/platform-multicluster.git
    targetRevision: main
    path: ocm/
  syncPolicy:
    automated:
      prune: true
      selfHeal: true