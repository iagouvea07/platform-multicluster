apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-spoke
  namespace: ocm-argocd
  labels:
    apps.open-cluster-management.io/pull-to-ocm-managed-cluster: "true"
  annotations:
    argocd.argoproj.io/skip-reconcile: "true"
    apps.open-cluster-management.io/ocm-managed-cluster: spoke
    apps.open-cluster-management.io/ocm-managed-cluster-app-namespace: argocd
    argocd.argoproj.io/sync-wave: "1"
spec:
  destination:
    server: https://kubernetes.default.svc
  project: default
  sources:
  - repoURL: git@github.com:iagouvea07/platform-multicluster.git
    targetRevision: main
    path: bootstrap/resources
  - repoURL: https://github.com/argoproj/argo-cd
    targetRevision: v3.5.5
    path: manifests/install.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true