apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ocm
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
  project: default
  sources:
    - repoURL: git@github.com:iagouvea07/platform-multicluster.git
      targetRevision: main
      path: ocm/resources/
   # - repoURL: oci://ghcr.io/cloudtooling/helm-charts/olm
   #   chart: olm
   #   targetRevision: 0.26.0 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true